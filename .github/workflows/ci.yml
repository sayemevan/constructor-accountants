# PR/main pipeline (ai-context/17 "CI/CD workflow"). E2E and image builds are added as those test suites and
# Dockerfiles land.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json → packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Includes the dependency-cruiser module boundary rules (pnpm lint:deps).
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Testcontainers (postgres:17 with the production role model); Docker is preinstalled on ubuntu-latest.
      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build
